<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Nitaq video stage</title>
<!-- The video's stage: title cards, section cards, terminal scenes, the frame around app scenes and
     the QR card. tools/video/render.cjs drives it frame by frame (window.setTime(t)), so every
     animation is deterministic. Brand: #0C3B3C background, white text, #5ED3B4 accent,
     IBM Plex Sans Arabic (embedded in src/nitaq/web/fonts.css). -->
<link rel="stylesheet" href="../../src/nitaq/web/fonts.css">
<style>
:root{--bg:#0C3B3C;--deep:#072829;--acc:#5ED3B4;--acc2:#F5B544;--ink:#ffffff;--muted:#a9cfc8;--no:#ff7b72;
  --ui:"Plex Arabic",system-ui,sans-serif;--mono:"JetBrainsMono Nerd Font Mono","JetBrains Mono","Plex Arabic","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui)}
body{position:relative;background:
  radial-gradient(1200px 700px at 78% 18%,rgba(94,211,180,.13),transparent 60%),
  radial-gradient(900px 600px at 12% 95%,rgba(245,181,68,.07),transparent 60%),var(--bg)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:36px 36px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.layer{position:absolute;inset:0;display:none}
body[data-kind="title"] #title, body[data-kind="card"] #card, body[data-kind="term"] #term,
body[data-kind="app"] #app, body[data-kind="qr"] #qr{display:block}
#fade{position:absolute;inset:0;background:var(--bg);pointer-events:none;z-index:50}

/* ---------- scope brackets (the logo idea) ---------- */
.brk{position:absolute;width:var(--s);height:var(--s);border:0 solid var(--acc);border-radius:6px}
.brk.tl{border-top-width:var(--w);border-left-width:var(--w);border-top-left-radius:calc(var(--s)*.22)}
.brk.tr{border-top-width:var(--w);border-right-width:var(--w);border-top-right-radius:calc(var(--s)*.22)}
.brk.bl{border-bottom-width:var(--w);border-left-width:var(--w);border-bottom-left-radius:calc(var(--s)*.22)}
.brk.br{border-bottom-width:var(--w);border-right-width:var(--w);border-bottom-right-radius:calc(var(--s)*.22)}

/* ---------- title ---------- */
#title .box{position:absolute;left:50%;top:50%;width:1240px;height:640px;transform:translate(-50%,-52%)}
#title .brk{--s:120px;--w:9px}
#title .tl{left:0;top:0;animation:inTL 1s cubic-bezier(.2,.8,.2,1) both}
#title .tr{right:0;top:0;animation:inTR 1s cubic-bezier(.2,.8,.2,1) both}
#title .bl{left:0;bottom:0;animation:inBL 1s cubic-bezier(.2,.8,.2,1) both}
#title .br{right:0;bottom:0;animation:inBR 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes inTL{from{transform:translate(-160px,-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes inTR{from{transform:translate(160px,-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes inBL{from{transform:translate(-160px,120px);opacity:0}to{transform:none;opacity:1}}
@keyframes inBR{from{transform:translate(160px,120px);opacity:0}to{transform:none;opacity:1}}
#title .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#title .logo{width:132px;height:132px;animation:pop .8s .35s cubic-bezier(.2,1.4,.3,1) both}
#title h1{margin:10px 0 0;font-size:150px;line-height:1.05;font-weight:700;letter-spacing:0;animation:up .8s .8s cubic-bezier(.2,.8,.2,1) both}
#title .tag{font-size:58px;font-weight:700;margin-top:4px;animation:up .8s 1.5s cubic-bezier(.2,.8,.2,1) both}
#title .tag b{color:var(--acc);position:relative;font-weight:700}
#title .tag b::after{content:"";position:absolute;inset:auto 0 -6px 0;height:8px;border-radius:4px;background:var(--acc);
  transform-origin:right;animation:wipe .6s 2.2s ease-out both;opacity:.55}
#title .sub{font-size:31px;color:var(--muted);margin-top:26px;max-width:1160px;line-height:1.55;text-wrap:balance;animation:up .8s 2.6s ease-out both}
#title .foot{position:absolute;bottom:64px;left:0;right:0;display:flex;justify-content:center;gap:14px;animation:up .8s 3.3s ease-out both}
.chip{font-size:22px;color:var(--ink);border:1.5px solid rgba(94,211,180,.45);background:rgba(94,211,180,.08);padding:8px 20px;border-radius:999px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* the action dot: inside the scope it moves freely; at the edge it is refused */
#title .dot{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--acc2);opacity:0;
  box-shadow:0 0 0 0 rgba(255,123,114,.0);animation:dot 2.2s 4.1s cubic-bezier(.4,0,.2,1) both}
@keyframes dot{0%{opacity:0;transform:translate(0,236px)}12%{opacity:1;transform:translate(0,236px)}
  62%{transform:translate(-560px,236px);background:var(--acc2)}70%{transform:translate(-585px,236px);background:var(--no);box-shadow:0 0 0 18px rgba(255,123,114,.25)}
  100%{transform:translate(-520px,236px);background:var(--no);opacity:0;box-shadow:0 0 0 40px rgba(255,123,114,0)}}

/* ---------- section card ---------- */
#card .box{position:absolute;left:50%;top:50%;width:1180px;height:520px;transform:translate(-50%,-50%)}
#card .brk{--s:84px;--w:7px}
#card .tl{left:0;top:0;animation:inTL .8s cubic-bezier(.2,.8,.2,1) both}
#card .tr{right:0;top:0;animation:inTR .8s cubic-bezier(.2,.8,.2,1) both}
#card .bl{left:0;bottom:0;animation:inBL .8s cubic-bezier(.2,.8,.2,1) both}
#card .br{right:0;bottom:0;animation:inBR .8s cubic-bezier(.2,.8,.2,1) both}
#card .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#card .num{font-size:40px;font-weight:700;color:var(--bg);background:var(--acc);width:86px;height:86px;border-radius:24px;display:grid;place-items:center;
  animation:pop .6s .2s cubic-bezier(.2,1.4,.3,1) both}
#card h2{margin:28px 0 0;font-size:92px;font-weight:700;line-height:1.15;animation:up .7s .45s cubic-bezier(.2,.8,.2,1) both}
#card p{margin:18px 0 0;font-size:36px;color:var(--muted);max-width:1040px;line-height:1.5;text-wrap:balance;animation:up .7s .8s ease-out both}

/* ---------- window (terminal and app) ---------- */
.win{position:absolute;left:150px;top:30px;width:1620px;height:876px;border-radius:16px;overflow:hidden;
  background:#061c1d;border:1px solid rgba(94,211,180,.28);box-shadow:0 30px 80px rgba(0,0,0,.45);direction:ltr}
.bar{height:36px;background:#0a2a2b;border-bottom:1px solid rgba(94,211,180,.18);display:flex;align-items:center;gap:8px;padding:0 16px;
  font:15px var(--ui);color:#9cc5be}
.bar .d{width:12px;height:12px;border-radius:50%}
.bar .ttl{margin-left:10px;font-family:var(--mono);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .badges{margin-left:auto;display:flex;gap:8px;direction:rtl}
.badge{font-size:14px;line-height:1;padding:5px 11px;border-radius:999px;border:1px solid rgba(94,211,180,.45);color:var(--acc);background:rgba(94,211,180,.1);white-space:nowrap}
.badge.amber{border-color:rgba(245,181,68,.5);color:var(--acc2);background:rgba(245,181,68,.1)}
.badge .rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--no);margin-inline-end:6px;vertical-align:1px}
.term{position:absolute;left:0;right:0;top:36px;bottom:0;padding:12px 18px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  font:17.5px/25px var(--mono);color:#d5e6e2;white-space:pre-wrap;word-break:break-all}
.term .ln{min-height:25px;direction:ltr;unicode-bidi:isolate}
.term.top{justify-content:flex-start}
.cursor{display:inline-block;width:.62em;height:21px;vertical-align:-4px;background:var(--acc)}
.hole{position:absolute;left:0;right:0;top:36px;bottom:0;background:#000}

/* ---------- caption band ---------- */
.cap{position:absolute;left:150px;right:150px;top:924px;height:140px;display:flex;flex-direction:column;justify-content:center;
  padding-right:28px;border-right:6px solid var(--acc);animation:capIn .6s .25s ease-out both}
.cap .step{font-size:21px;color:var(--acc);font-weight:700;margin-bottom:6px}
.cap .txt{font-size:31px;line-height:1.45;font-weight:600;text-wrap:balance}
.cap .txt b{color:var(--acc);font-weight:700}
.cap .txt .no{color:var(--no)}
@keyframes capIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.mark{position:absolute;left:150px;top:938px;display:flex;align-items:center;gap:12px;direction:rtl;opacity:.9}
.mark svg{width:44px;height:44px}.mark span{font-size:26px;font-weight:700}

/* ---------- QR ---------- */
#qr .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:110px}
#qr .qrbox{width:520px;height:520px;background:#fff;border-radius:34px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.4);
  animation:pop .8s .3s cubic-bezier(.2,1.3,.3,1) both;position:relative}
#qr .qrbox svg{width:100%;height:100%;display:block}
#qr .qrbox .brk{--s:70px;--w:7px;border-color:var(--acc)}
#qr .qrbox .tl{left:-26px;top:-26px}#qr .qrbox .tr{right:-26px;top:-26px}#qr .qrbox .bl{left:-26px;bottom:-26px}#qr .qrbox .br{right:-26px;bottom:-26px}
#qr .side{max-width:820px;text-align:right}
#qr .side .logo{width:96px;height:96px;animation:pop .6s .5s both}
#qr h2{font-size:96px;margin:18px 0 0;line-height:1.1;animation:up .7s .7s both}
#qr .tag{font-size:44px;font-weight:700;margin-top:14px;animation:up .7s 1s both}#qr .tag b{color:var(--acc)}
#qr .url{direction:ltr;text-align:right;font:26px var(--mono);color:var(--acc);margin-top:30px;word-break:break-all;animation:up .7s 1.3s both}
#qr .note{font-size:24px;color:var(--muted);margin-top:30px;line-height:1.6;animation:up .7s 1.6s both}
</style>
</head>
<body data-kind="title">
<div class="grid"></div>

<template id="logoT"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#127a70"/><stop offset="1" stop-color="#0a4741"/></linearGradient></defs>
<rect width="64" height="64" rx="15" fill="url(#lg)" stroke="rgba(94,211,180,.5)" stroke-width="1"/><g fill="none" stroke="#f6f1e7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M14 25V16a2 2 0 0 1 2-2h9"/><path d="M39 14h9a2 2 0 0 1 2 2v9"/><path d="M50 39v9a2 2 0 0 1-2 2h-9"/><path d="M25 50h-9a2 2 0 0 1-2-2v-9"/></g>
<circle cx="32" cy="32" r="7.5" fill="#f5b544"/></svg></template>

<section class="layer" id="title"><div class="box">
  <i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>
  <div class="center">
    <div class="logo" data-logo></div>
    <h1>نِطاق</h1>
    <div class="tag">أي فعل خارج النطاق.. <b>مرفوض</b></div>
    <div class="sub" id="tSub"></div>
  </div>
</div><div class="foot" id="tFoot"></div></section>

<section class="layer" id="card"><div class="box">
  <i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>
  <div class="center"><div class="num" id="cNum"></div><h2 id="cTitle"></h2><p id="cSub"></p></div>
</div></section>

<section class="layer" id="term">
  <div class="win"><div class="bar"><span class="d" style="background:#ff5f56"></span><span class="d" style="background:#ffbd2e"></span><span class="d" style="background:#27c93f"></span>
    <span class="ttl" id="tTitle"></span><span class="badges" id="tBadges"></span></div><div class="term" id="tBody"></div></div>
</section>

<section class="layer" id="app">
  <div class="win"><div class="bar"><span class="d" style="background:#ff5f56"></span><span class="d" style="background:#ffbd2e"></span><span class="d" style="background:#27c93f"></span>
    <span class="ttl" id="aTitle"></span><span class="badges" id="aBadges"></span></div><div class="hole"></div></div>
</section>

<section class="layer" id="qr"><div class="wrap">
  <div class="side"><div class="logo" data-logo></div><h2>جرّب نِطاق بنفسك</h2><div class="tag">أي فعل خارج النطاق.. <b>مرفوض</b></div>
    <div class="url" id="qUrl"></div><div class="note" id="qNote"></div></div>
  <div class="qrbox" id="qBox"><i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i></div>
</div></section>

<div class="cap" id="cap" style="display:none"><div class="step" id="capStep"></div><div class="txt" id="capTxt"></div></div>
<div id="fade"></div>

<script>
document.querySelectorAll("[data-logo]").forEach((el) => el.append(document.getElementById("logoT").content.cloneNode(true)));
const $ = (id) => document.getElementById(id);
let S = null, DUR = 1, TL = [], fed = 0, lines = [[]], col = 0, st = {fg: null, bold: false, dim: false}, esc = "";

/* ---- terminal emulation (a small subset: SGR colours, CR, LF, BS, TAB) — from tools/record/make_player.py ---- */
const FG = {30:"#6e7681",31:"#ff7b72",32:"#3fb950",33:"#d29922",34:"#58a6ff",35:"#bc8cff",36:"#5ED3B4",37:"#b1bac4",
            90:"#6e7681",91:"#ffa198",92:"#56d364",93:"#e3b341",94:"#79c0ff",95:"#d2a8ff",96:"#7ee8cf",97:"#f0f6fc"};
const BRIGHT = {31:"#ff8f86",32:"#56d364",33:"#e3b341",34:"#79c0ff",35:"#d2a8ff",36:"#7ee8cf"};
function sgr(p){const ps=p===""?[0]:p.split(";").map(Number);for(const x of ps){if(x===0)st={fg:null,bold:false,dim:false};else if(x===1)st.bold=true;
  else if(x===2)st.dim=true;else if(x===22){st.bold=false;st.dim=false}else if(x===39)st.fg=null;else if((x>=30&&x<=37)||(x>=90&&x<=97))st.fg=x;}}
function put(ch){const L=lines[lines.length-1];const c={ch,fg:st.fg,bold:st.bold,dim:st.dim};if(col<L.length)L[col]=c;else{while(L.length<col)L.push({ch:" "});L.push(c)}col++}
function feed(s){for(const ch of s){if(esc){esc+=ch;if(esc.length===2&&ch!=="["){esc="";continue}if(/[A-Za-z~]/.test(ch)&&esc.length>2){if(ch==="m")sgr(esc.slice(2,-1).replace("?",""));esc=""}continue}
  if(ch==="\x1b"){esc=ch;continue}if(ch==="\n"){lines.push([]);col=0;continue}if(ch==="\r"){col=0;continue}if(ch==="\b"){col=Math.max(0,col-1);continue}
  if(ch==="\t"){const n=8-(col%8);for(let i=0;i<n;i++)put(" ");continue}if(ch<" ")continue;put(ch)}}
function color(c){if(!c.fg)return c.bold?"#ffffff":(c.dim?"#86a9a3":null);return(c.bold&&BRIGHT[c.fg])?BRIGHT[c.fg]:FG[c.fg]}
function lineEl(L){const d=document.createElement("div");d.className="ln";let cur=null,buf="";
  const flush=()=>{if(!buf)return;const sp=document.createElement("span");sp.textContent=buf;if(cur){const c=color(cur);if(c)sp.style.color=c;if(cur.bold)sp.style.fontWeight="700"}d.append(sp);buf=""};
  for(const c of L){const k=c.fg+"|"+c.bold+"|"+c.dim,ck=cur?cur.fg+"|"+cur.bold+"|"+cur.dim:null;if(k!==ck){flush();cur=c}buf+=c.ch}flush();return d}
function drawTerm(cursorOn){const T=$("tBody");T.textContent="";const view=lines.slice(-60);
  view.forEach((L,i)=>{const d=lineEl(L);if(i===view.length-1&&cursorOn){const cu=document.createElement("span");cu.className="cursor";d.append(cu)}T.append(d)})}

/* timeline: typing keeps its pace; command output gaps are divided by `speed` (shown as a badge) */
function buildTimeline(cast, speed, lead){const ev=cast.events,marks=cast.marks;let t=lead,prev=0;const out=[];
  for(let i=0;i<ev.length;i++){let dt=Math.max(0,ev[i][0]-prev);prev=ev[i][0];
    const m=marks.find((m)=>i>=m.start&&i<m.end);if(m&&m.typed_end!=null&&i>=m.typed_end)dt=Math.min(dt,2.0)/speed;
    t+=dt;out.push([t,ev[i][2]])}return out}

window.setup = function(scene){S=scene;document.body.dataset.kind=scene.kind;DUR=scene.dur||1;
  if(scene.caption){$("cap").style.display="";$("capStep").textContent=scene.step||"";$("capTxt").innerHTML=scene.caption}
  if(scene.kind==="title"){$("tSub").textContent=scene.sub;$("tFoot").innerHTML=scene.chips.map((c)=>`<span class="chip">${c}</span>`).join("")}
  if(scene.kind==="card"){$("cNum").textContent=scene.num;$("cTitle").textContent=scene.title;$("cSub").textContent=scene.sub}
  const badges=(el)=>{el.innerHTML=`<span class="badge"><span class="rec"></span>تسجيل حقيقي</span>`+(scene.fake_home?`<span class="badge">HOME وهمي · بيانات تجريبية</span>`:"")+
    (scene.speed&&scene.speed>1?`<span class="badge amber">مُسرَّع ×${scene.speed}</span>`:"")};
  if(scene.kind==="term"){$("tTitle").textContent=scene.wtitle;badges($("tBadges"));TL=buildTimeline(scene.cast,scene.speed||1,scene.lead||.8);
    DUR=TL[TL.length-1][0]+(scene.hold||3);fed=0;lines=[[]];col=0;st={fg:null,bold:false,dim:false};esc="";drawTerm(true)}
  if(scene.kind==="app"){$("aTitle").textContent=scene.wtitle;badges($("aBadges"))}
  if(scene.kind==="qr"){$("qUrl").textContent=scene.url;$("qNote").textContent=scene.note;$("qBox").insertAdjacentHTML("afterbegin",scene.qr_svg)}
  document.getAnimations().forEach((a)=>a.pause());
  return DUR};

let lastKey = "";
window.setTime = function(t){
  document.getAnimations().forEach((a)=>{a.currentTime=t*1000});
  const fin=Math.min(1,t/0.35),fout=S.kind==="app"?1:Math.min(1,(DUR-t)/0.35);
  $("fade").style.opacity=String(Math.max(0,1-Math.min(fin,fout)));
  let key=$("fade").style.opacity+"|"+(t<2.5?Math.round(t*30):"x");
  if(S.kind==="term"){let n=0;while(n<TL.length&&TL[n][0]<=t)n++;
    if(n<fed){fed=0;lines=[[]];col=0;st={fg:null,bold:false,dim:false};esc=""}
    for(;fed<n;fed++)feed(TL[fed][1]);const cur=Math.floor(t*1.6)%2===0;drawTerm(cur);key+="|"+fed+"|"+cur}
  else if(t<6.5)key+="|"+Math.round(t*30);
  const changed=key!==lastKey;lastKey=key;return changed};
</script>
</body>
</html>
