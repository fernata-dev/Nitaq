name: ci
on: [push, pull_request]
jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}${{ matrix.numpy && ' + numpy' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", numpy: false}
          - {os: ubuntu-latest, python: "3.13", numpy: true}
          - {os: windows-latest, python: "3.12", numpy: false}
          - {os: macos-latest, python: "3.12", numpy: false}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: the freeze check needs the pinned freeze commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"    # the browser engine (JS) is compared with the Python one
      - run: pip install -e ".[dev]"
      - if: matrix.numpy
        run: pip install numpy        # results must be identical with or without optional packages
      - run: python -m nitaq_bench restore-tags
      - run: python -m pytest
      - run: python -m nitaq_bench validate
      - run: python -m nitaq_bench verify-freeze
      - run: python -m nitaq_bench verify-repro
      - run: nitaq --version
      - run: nitaq --home tests --no-project --no-color
      - shell: bash
        run: python -m nitaq_bench scan-skill fixtures/malicious_skill.md --fail-on high || test $? -eq 3
