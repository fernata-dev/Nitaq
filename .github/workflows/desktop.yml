name: desktop
# Builds the Nitaq desktop app for Windows, macOS and Linux and attaches it to a GitHub release.
# Run it from the Actions tab (workflow_dispatch) or push a tag like v1.0.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to create or update (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-latest, name: macOS}
          - {os: ubuntu-22.04, name: Linux}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . "pyinstaller>=6.10"
      - if: runner.os != 'Linux'
        run: pip install "pywebview>=5"
      - name: macOS icon (.icns)
        if: runner.os == 'macOS'
        run: |
          mkdir nitaq.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icons/nitaq-1024.png --out nitaq.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d packaging/icons/nitaq-1024.png --out nitaq.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns nitaq.iconset -o packaging/icons/nitaq.icns
      - name: Build
        shell: bash
        run: |
          common="--noconfirm --clean --collect-data nitaq --collect-data nitaq_bench --collect-submodules nitaq --collect-submodules nitaq_bench"
          case "$RUNNER_OS" in
            Windows) pyinstaller $common --onefile --windowed --name Nitaq --icon packaging/icons/nitaq.ico packaging/nitaq_app.py ;;
            macOS)   pyinstaller $common --windowed --name Nitaq --icon packaging/icons/nitaq.icns --osx-bundle-identifier bond.byhamo.nitaq packaging/nitaq_app.py ;;
            Linux)   pyinstaller $common --onefile --name nitaq-app packaging/nitaq_app.py ;;
          esac
      - name: Smoke test (the app doubles as the nitaq command)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) ./dist/Nitaq.exe --version && ./dist/Nitaq.exe scan fixtures/malicious_skill.md --fail-on high || test $? -eq 3 ;;
            macOS)   ./dist/Nitaq.app/Contents/MacOS/Nitaq --version && ./dist/Nitaq.app/Contents/MacOS/Nitaq scan fixtures/malicious_skill.md --fail-on high || test $? -eq 3 ;;
            Linux)   ./dist/nitaq-app --version && ./dist/nitaq-app scan fixtures/malicious_skill.md --fail-on high || test $? -eq 3 ;;
          esac
      - name: Package
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp dist/Nitaq.exe out/Nitaq-Windows-x64.exe ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent dist/Nitaq.app out/Nitaq-macOS.zip ;;
            Linux)   mkdir -p pkg/Nitaq && cp dist/nitaq-app packaging/linux/install.sh pkg/Nitaq/ && cp packaging/icons/nitaq-512.png pkg/Nitaq/nitaq.png && tar -C pkg -czf out/Nitaq-Linux-x64.tar.gz Nitaq ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: nitaq-${{ matrix.name }}
          path: out/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Nitaq $TAG" --notes-file packaging/RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
